[project]
name = "training-partner-backend"
version = "0.1.0"
description = "Training Partner backend API"
readme = "README.md"
authors = [
    { name = "LudoCarlu", email = "ludoviccarlu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "dlt>=1.30.0",
    "fastapi>=0.141.1",
    "garminconnect>=0.3.16",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# env vars must be set before `app.core.config` is ever imported (see the module docstring).
"tests/api/conftest.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.rules]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
