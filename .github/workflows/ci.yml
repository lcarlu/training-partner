name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend + data (uv, ruff, ty, pytest, dbt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check (ty)
        working-directory: backend
        run: uv run ty check

      - name: Pytest
        working-directory: backend
        run: uv run pytest

      - name: dbt parse (static check, no live warehouse needed)
        working-directory: backend
        run: uv run dbt parse --project-dir ../data/dbt --profiles-dir ../data/dbt

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
